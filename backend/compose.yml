name: acis-backend
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: acis_inicializador
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${ACIS_POSTGRES_PASSWORD:?Completa ACIS_POSTGRES_PASSWORD en .env}
      ACIS_USUARIOS_DB_PASSWORD: ${ACIS_USUARIOS_DB_PASSWORD:?Completa ACIS_USUARIOS_DB_PASSWORD en .env}
      ACIS_OPERACIONES_DB_PASSWORD: ${ACIS_OPERACIONES_DB_PASSWORD:?Completa ACIS_OPERACIONES_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./infra/crear-bases.sh:/docker-entrypoint-initdb.d/crear-bases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acis_inicializador -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  correo:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  datos-postgres:
